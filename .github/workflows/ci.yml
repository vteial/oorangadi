name: Flutter CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'

jobs:
  analyze-test-build:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Build web
        run: flutter build web --release

  integration-test:
    name: Integration Tests (Web)
    runs-on: ubuntu-latest
    needs: analyze-test-build
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run integration tests (headless)
        run: |
          chromedriver --port=4444 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status >/dev/null 2>&1; then
              echo "ChromeDriver ready after ${i}s."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ChromeDriver did not become ready within 30s."
              exit 1
            fi
            sleep 1
          done
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server \
            --browser-name=chrome \
            --headless
